name: Build testing candidate
on:
  push:
    branches: [testing]
    tags: ['testing-v*']
  workflow_dispatch:
    inputs:
      testing_version:
        description: Optional four-part candidate version; empty validates only
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: testing-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  testing:
    if: github.ref == 'refs/heads/testing' || startsWith(github.ref, 'refs/tags/testing-v')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Validate testing source and version
        id: candidate
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.testing_version }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/testing
          if ($LASTEXITCODE) { throw 'Candidate source must belong to testing' }
          $candidateVersion=$env:REQUESTED_VERSION
          if ($env:SOURCE_REF.StartsWith('refs/tags/')) {
            if ($env:SOURCE_TAG -notmatch '^testing-v(\d+\.\d+\.\d+\.\d+)$') { throw 'Invalid testing tag' }
            $candidateVersion=$Matches[1]
          }
          if ($candidateVersion -and $candidateVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Invalid testing version' }
          "version=$candidateVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          Expand-Archive "$env:RUNNER_TEMP/dalamud.zip" -DestinationPath "$env:APPDATA/XIVLauncher/addon/Hooks/dev" -Force
      - name: Build and validate
        shell: pwsh
        env:
          TESTING_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          $buildArgs=@('build','RotationSolver/RotationSolver.csproj','-c','Release')
          if ($env:TESTING_VERSION) {
            if ($env:TESTING_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Expected a four-part version' }
            $buildArgs+="-p:Version=$env:TESTING_VERSION"
          }
          dotnet @buildArgs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:TESTING_VERSION -and [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path 'RotationSolver/bin/Release/RotationSolver.dll')).Version -ne [version]$env:TESTING_VERSION) { throw 'Actual DLL version differs' }
          dotnet run --project tests/Settings.Tests.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package opt-in candidate
        if: steps.candidate.outputs.version != ''
        shell: pwsh
        env:
          TESTING_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          $stable=Join-Path $env:RUNNER_TEMP 'stable-feed.json'
          Invoke-WebRequest https://raw.githubusercontent.com/FFXIV-CombatReborn/CombatRebornRepo/main/pluginmaster.json -OutFile $stable
          python tools/package_testing.py --tag "testing-v$env:TESTING_VERSION" --stable-feed $stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_testing_package.py --tag "testing-v$env:TESTING_VERSION" --stable-feed $stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git rev-parse HEAD | Set-Content artifacts/testing/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: steps.candidate.outputs.version != ''
        with:
          name: testing-candidate-${{ github.sha }}
          path: artifacts/testing/
          if-no-files-found: error
      - name: Publish explicitly tagged testing candidate
        if: startsWith(github.ref, 'refs/tags/testing-v')
        uses: kaldigo/DalamudPlugins/.github/actions/publish-testing@3c2396b29baf30d751ceb273708d8bfb64ee019a
        with:
          internal-name: RotationSolver
          source-commit: ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
